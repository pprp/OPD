[tool.ruff]
target-version = "py311"
line-length = 120
exclude = [
    ".git",
    ".ruff_cache",
    ".venv",
    "LlamaFactory",
    "verl",
    "datasets",
    "figs",
    "logs",
    "checkpoint",
    "model",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]
ignore = [
    "E501",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
